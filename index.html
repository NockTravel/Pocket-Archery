<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Archery</title>
  <script type="module" crossorigin src="./assets/index-CeDKLxwg.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BDd-Af-g.css">
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="pill">End<b id="hEnd">1/3</b></div>
      <div class="pill">Arrow<b id="hArrow">1/6</b></div>
      <div class="pill">Dist<b id="hDist">18 m</b></div>
      <div class="pill">Last<b id="hLast">—</b></div>
      <div class="pill gold">End score<b id="hScore">0</b></div>
    </div>

    <div id="wind"><span id="windArrow">↑</span> <span id="windMph">0</span></div>

    <!-- score call-out -->
    <div id="callout"></div>

    <!-- scope inset frame (the magnified sight window) -->
    <div id="scopeframe" class="hidden"></div>

    <!-- aim reticle: contracting steadiness ring + countdown ring -->
    <div id="sight" class="hidden">
      <svg viewBox="-60 -60 120 120" width="120" height="120">
        <circle id="count" cx="0" cy="0" r="52" fill="none" stroke="#f2c45a" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90)" />
        <circle id="steady" cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="3" />
        <line x1="-13" y1="0" x2="13" y2="0" stroke="#fff" stroke-width="2" />
        <line x1="0" y1="-13" x2="0" y2="13" stroke="#fff" stroke-width="2" />
      </svg>
    </div>

    <!-- draw meter -->
    <div id="meters" class="hidden">
      <div id="drawWrap"><div id="drawFill"></div><div id="drawFull"></div></div>
      <div id="drawLbl">DRAW</div>
    </div>

    <!-- controls -->
    <div id="controls">
      <div id="nudge" class="hidden">
        <button class="nub" data-d="l">◀</button>
        <div class="nubcol">
          <button class="nub" data-d="u">▲</button>
          <button class="nub" data-d="d">▼</button>
        </div>
        <button class="nub" data-d="r">▶</button>
      </div>
      <div class="row">
        <button id="btnDraw" class="btn">Hold to draw</button>
        <button id="btnRange" class="btn sec">Indoor</button>
        <button id="btnNext" class="btn sec hidden">Next</button>
      </div>
      <div id="msg">Loading…</div>
    </div>
  </div>
</body>
</html>
